services:
  - type: web
    name: photo-album-render-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: PORT
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_FILE_SIZE_BYTES
        value: 26214400
      - key: MAX_FILE_COUNT
        value: 80
